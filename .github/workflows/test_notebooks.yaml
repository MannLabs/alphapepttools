name: Test Notebooks

on:
  push:
    branches: [main]
  pull_request:

  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            name: LOOSE-FULL
            extras: "full"
          - os: ubuntu-latest
            python: "3.14"
            name: LOOSE-FULL
            extras: "full"
          - os: ubuntu-latest
            python: "3.11"
            name: STABLE-FULL
            extras: "full-stable"
          - os: ubuntu-latest
            python: "3.14"
            name: STABLE-FULL
            extras: "full-stable"

    name: ${{ matrix.name }} Python ${{ matrix.python }}

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel
      - name: Install dependencies
        run: |
          if [ -n "${{ matrix.extras }}" ]; then
            pip install ${{ matrix.pip-flags }} ".[dev,test,${{ matrix.extras }}]"
          else
            pip install ${{ matrix.pip-flags }} ".[dev,test]"
          fi
      - name: Test notebooks
        run: |
          cd tests
          ./run_notebook_tests.sh
